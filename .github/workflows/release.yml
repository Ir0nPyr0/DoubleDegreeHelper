name: Installer bauen

# Läuft, wenn auf GitHub ein Release veröffentlicht wird (Tag z.B. v1.0.8).
# Baut den Windows-Installer mit genau dieser Versionsnummer und hängt ihn ans Release.
# Über "Run workflow" kann man auch nur testweise bauen (ohne Release).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer für den Testbuild (z.B. 1.0.8)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
          fi
          VERSION="$(echo "$RAW" | sed -E 's/^[^0-9]*//')"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Tag '$RAW' ist keine gültige Version. Bitte z.B. v1.0.8 verwenden."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Baue Version $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset sicherstellen
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset --version 3.14.1 -y --no-progress
              $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
            }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Installer bauen
        shell: pwsh
        run: .\gradlew.bat jpackage "-PappVersion=${{ steps.ver.outputs.version }}" --no-daemon

      - name: Installer umbenennen
        id: exe
        shell: bash
        run: |
          EXE="$(find build/jpackage -maxdepth 1 -name '*.exe' | head -n 1)"
          if [ -z "$EXE" ]; then echo "::error::Kein Installer in build/jpackage gefunden"; ls -la build/jpackage; exit 1; fi
          OUT="build/DoubleDegreeHelper-Setup-${{ steps.ver.outputs.version }}.exe"
          mv "$EXE" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Installer als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: DoubleDegreeHelper-Setup-${{ steps.ver.outputs.version }}
          path: ${{ steps.exe.outputs.path }}

      - name: Installer ans Release hängen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.exe.outputs.path }}" --clobber --repo "${{ github.repository }}"
