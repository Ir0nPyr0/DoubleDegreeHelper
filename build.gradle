plugins {
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'org.gradlex.extra-java-module-info' version '1.12'
  id 'org.beryx.jlink' version '3.1.1'
  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group   = 'Calculator'
version = findProperty('appVersion') ?: '1.1.2'

repositories { mavenCentral() }

java {
  modularity.inferModulePath = true
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
  sourceCompatibility = '21'
  targetCompatibility = '21'
}

ext {
  junitVersion = '5.9.2'
  poiVersion   = '5.4.1'
  upgradeUuid  = '12345678-90ab-cdef-1234-567890abcdef'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
  inputs.property('version', project.version)
  filesMatching('**/version.properties') {
    expand(version: project.version)
  }
}

application {
  mainClass = 'calculator.doubledegreehelper.App'
  mainModule = 'calculator.doubledegreehelper'
  applicationDefaultJvmArgs = [
          '--add-modules', 'javafx.controls,javafx.fxml,javafx.media'
  ]
}

javafx {
  version = '21.0.7'
  modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

dependencies {
  implementation 'org.controlsfx:controlsfx:11.1.2'
  implementation('com.dlsc.formsfx:formsfx-core:11.6.0') { exclude group: 'org.openjfx' }
  implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'

  implementation 'org.slf4j:slf4j-api:2.0.17'
  runtimeOnly   'ch.qos.logback:logback-classic:1.4.14'
  runtimeOnly('org.apache.logging.log4j:log4j-to-slf4j:2.24.3') {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
  }

  implementation 'org.apache.pdfbox:pdfbox:3.0.4'
  implementation 'org.apache.commons:commons-math3:3.6.1'
  implementation "org.apache.poi:poi-ooxml:${poiVersion}"
  implementation 'org.jetbrains:annotations:24.0.0'
  implementation 'commons-logging:commons-logging:1.3.5'

  testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
  testRuntimeOnly  "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

test { useJUnitPlatform() }

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'DoubleDegreeHelper_installer'
  }

  jpackage {
      installerType = 'exe'     // WiX nötig
      // weitere Optionen möglich:
      imageName       = 'DoubleDegreeHelper'
      appVersion      = project.version
      installerOptions += [
          '--win-dir-chooser',
          '--win-shortcut',
          '--win-menu',
      ]
      imageOptions += [
          '--icon', 'src/main/resources/calculator/icon.ico'
      ]
  }
}

jlinkZip {
  group = 'distribution'
}

extraJavaModuleInfo {
    automaticModule('org.apache.commons:commons-math3', 'commons.math3')
}

tasks.named('clean', Delete) {
    doFirst {
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            ['app.exe', 'DoubleDegreeHelper.exe'].each { exeName ->
                exec {
                    executable 'taskkill'
                    args '/IM', exeName, '/F', '/T'
                    ignoreExitValue = true
                }
            }
        }
    }
    doLast {
        // Versucht, das jpackage-Verzeichnis zu löschen, scheitert aber nicht hart,
        // falls Windows noch einen Handle hält.
        try {
            delete file("${buildDir}/jpackage")
        } catch (Exception ex) {
            logger.lifecycle("[clean] konnte build/jpackage nicht entfernen (wird übersprungen): {}", ex.message)
        }
    }
}

['jpackageImage', 'jpackage'].each { t ->
    tasks.matching { it.name == t }.configureEach {
        doFirst {
            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                ['app.exe', 'DoubleDegreeHelper.exe'].each { exeName ->
                    exec {
                        executable 'taskkill'
                        args '/IM', exeName, '/F', '/T'
                        ignoreExitValue = true
                    }
                }
            }
        }
    }
}

jar {
  manifest {
    attributes(
        'Main-Class': application.mainClass.get()
    )
  }
}

shadowJar {
    archiveBaseName.set('DoubleDegreeHelper')
    archiveClassifier.set('')
    archiveVersion.set('')

    exclude('module-info.class')

    mergeServiceFiles()
}

tasks.build { dependsOn(shadowJar) }